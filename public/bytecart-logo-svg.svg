<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Vibrant Tech Blue-Purple Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
    
    <!-- Warm Accent Gradient for Bytes -->
    <linearGradient id="byteGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA709A" />
      <stop offset="100%" stop-color="#FEE140" />
    </linearGradient>

    <!-- Drop Shadow for 3D Modern Pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Optional: remove this rect for a transparent favicon) -->
  <rect width="256" height="256" rx="50" fill="#0D0E15" />

  <!-- Modern Cart Frame -->
  <path d="M 40 50 
           L 70 50 
           L 100 150 
           L 190 150 
           L 220 75 
           L 80 75" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Cart Wheels (Nodes) -->
  <circle cx="110" cy="195" r="16" fill="url(#neonGradient)" />
  <circle cx="180" cy="195" r="16" fill="url(#neonGradient)" />

  <!-- Floating 'Bytes' (Digital Items in Cart) -->
  <rect x="115" y="90" width="28" height="28" rx="8" fill="url(#byteGradient)" filter="url(#glow)"/>
  <rect x="155" y="115" width="20" height="20" rx="6" fill="#00F2FE" />
  <circle cx="180" cy="95" r="12" fill="url(#byteGradient)" />
</svg>
